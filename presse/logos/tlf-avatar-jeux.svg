<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TLF Studio — Jeux">
<!--
  Avatar à pastille TLF Studio — 512 × 512, base identique à tlf-avatar.svg (fond #111111, rx 96).
  Monogramme remonté de 10 px : translate(106 96) scale(2.5), il occupe y 121 → 371.
  Bandeau #E8562A de y 420 à 512, découpé par la forme de l'avatar (clipPath) pour suivre les coins.
  Libellé : capitales de 40 px, soit la taille du carré accent à l'échelle 2,5 (16 × 2,5) ;
  corps 40 / 0,7 = 57,143 px. Centré dans le bandeau : capitales de 446 à 486, ligne de base 486.
  Centrage horizontal sur l'encre des lettres, espacement final exclu.
  Sous 64 px, utiliser tlf-avatar.svg sans pastille : le libellé n'est plus lisible.
-->
<defs><clipPath id="tlf-avatar-jeux-forme"><rect width="512" height="512" rx="96"/></clipPath></defs>
